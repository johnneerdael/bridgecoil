[package]
name = "adb-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
[dependencies]
libadb = { version = "=0.7.0", default-features = false, features = ["tokio", "host-keys", "tls", "pairing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "io-util", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
axmldecoder = "0.5.0"
[dev-dependencies]
tempfile = "3"
