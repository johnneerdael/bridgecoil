name: PR gate

# Release notes come from the PR body, so a PR can't merge without them. Runs with no secrets.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: node --test scripts/next-release.test.mjs

      - name: Check the release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/next-release.mjs check-pr
