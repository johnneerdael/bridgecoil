name: Android release

# Runs only on version tags and manual dispatch, both of which need write access.
# Never add pull_request here: this job can read the signing key.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NDK_VERSION: 28.2.13676358
      BUILD_TOOLS: 36.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app version $version"
            exit 1
          }

      - run: npm ci

      - name: Test
        run: |
          npx vitest run
          npm run -s check
          node --test scripts/release-notes.test.mjs
          node scripts/cargo.mjs test -p adb-core

      - name: Write signing config
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.p12"
          } > src-tauri/gen/android/keystore.properties

      - name: Build
        run: npm run -s android -- build --apk --target aarch64 --ci

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" src-tauri/gen/android/keystore.properties

      - name: Check the signing certificate
        env:
          EXPECTED: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          [ -n "$EXPECTED" ] || { echo "::error::ANDROID_SIGNER_SHA256 is not set"; exit 1; }
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::No release APK was produced"; exit 1; }
          actual=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$actual" = "$EXPECTED" ] || {
            echo "::error::APK signer '$actual' doesn't match the release key"
            exit 1
          }
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p release
          cp "$apk" "release/Bridgecoil-$version-arm64.apk"
          (cd release && sha256sum -- *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridgecoil-android
          path: release/
          if-no-files-found: error

      - name: Prepare branded release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/generated-notes.md"
          node scripts/release-notes.mjs --repository "$GH_REPO" \
            --version "${GITHUB_REF_NAME#v}" --sha "$GITHUB_SHA" \
            --changes "$RUNNER_TEMP/generated-notes.md" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Bridgecoil $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
