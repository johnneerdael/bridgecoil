name: Release

# Every push to main, which includes merged PRs, releases Android and iOS when it has something
# user-facing since the last release. A manual run is a private test build unless told otherwise.
# Never add pull_request here: these jobs can read the signing keys.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release, rather than only building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.ready.outputs.release }}
      version: ${{ steps.ready.outputs.version }}
      focus: ${{ steps.ready.outputs.focus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: node --test scripts/next-release.test.mjs

      - name: Decide what to release
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          node scripts/next-release.mjs plan changes.md
          # A newer push will release these notes too, and its tag is on the tip of main.
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$RELEASE_SHA" ]; then
            echo "A newer commit is on main, so its run will release this."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$MANUAL_PUBLISH" != true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-changes
          path: changes.md
          if-no-files-found: error

  android:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NDK_VERSION: 28.2.13676358
      BUILD_TOOLS: 36.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Set the release version
        if: needs.plan.outputs.release == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/next-release.mjs stamp "$VERSION"

      - name: Test
        run: |
          npx vitest run
          npm run -s check
          node --test scripts/release-notes.test.mjs scripts/next-release.test.mjs
          node scripts/cargo.mjs test -p adb-core

      - name: Write signing config
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.p12"
          } > src-tauri/gen/android/keystore.properties

      - name: Build
        run: npm run -s android -- build --apk --target aarch64 --ci

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" src-tauri/gen/android/keystore.properties

      - name: Check the signing certificate
        env:
          EXPECTED: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          [ -n "$EXPECTED" ] || { echo "::error::ANDROID_SIGNER_SHA256 is not set"; exit 1; }
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::No release APK was produced"; exit 1; }
          actual=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$actual" = "$EXPECTED" ] || {
            echo "::error::APK signer '$actual' doesn't match the release key"
            exit 1
          }
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p release
          cp "$apk" "release/Bridgecoil-$version-arm64.apk"
          (cd release && sha256sum -- *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridgecoil-android
          path: release/
          if-no-files-found: error

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.plan.outputs.release == 'true'
        with:
          name: release-changes
          path: ${{ runner.temp }}/changes

      - name: Publish release
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release-notes.mjs --repository "$GH_REPO" --version "$VERSION" \
            --sha "$GITHUB_SHA" --changes "$RUNNER_TEMP/changes/changes.md" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --latest \
            --title "Bridgecoil v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

  ios:
    needs: [plan, android]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-beta.yml
    with:
      mode: testflight
      version: ${{ needs.plan.outputs.version }}
      release_focus: ${{ needs.plan.outputs.focus }}
    secrets: inherit
