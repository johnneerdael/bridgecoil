name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/guide/**", "docs/user-guide/**", "docs/site-requirements.txt", "mkdocs.yml", "scripts/docs-shots.py", "scripts/build-site.py", "scripts/check-site.py", "scripts/release-notes*.mjs", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/guide/**", "docs/user-guide/**", "docs/site-requirements.txt", "mkdocs.yml", "scripts/docs-shots.py", "scripts/build-site.py", "scripts/check-site.py", "scripts/release-notes*.mjs", ".github/workflows/pages.yml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r docs/site-requirements.txt
      - run: python3 scripts/docs-shots.py --check
      - run: python3 scripts/build-site.py
      - run: python3 scripts/check-site.py
      - run: node --check site/theme.js
      - run: node --check site/site.js
      - run: node --test scripts/release-notes.test.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
